stages:
  - build
  - release

image: docker:latest

services:
  - docker:dind

#### Multi-platform builds need a runner host with QEMU binfmt handlers registered
default:
  tags:
    - imagex

variables:
  DOCKER_REGISTRY: "epicsoft/zitadel-tools"
  BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

#### The tokens go in over stdin: '-p' would put them in the process list of the runner.
before_script:
  - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
  - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin

after_script:
  - docker logout $CI_REGISTRY
  - docker logout

#### Publishing happens from the default branch and from the weekly schedule, nowhere else.
.rulesPublish: &rulesPublish
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  retry: 2
  rules: *rulesPublish
  script:
    - docker context create dind
    - docker buildx create --name epicbuilder --driver docker-container --use dind
    - BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    #### resolved once, so both platforms build the same version
    - ZITADEL_TOOLS_VERSION=$(docker run --rm golang:alpine go list -m -f '{{.Version}}' github.com/zitadel/zitadel-tools@latest)
    - ZITADEL_TOOLS_VERSION=${ZITADEL_TOOLS_VERSION#v}
    - echo "Build ZITADEL Tools Docker image with zitadel-tools ${ZITADEL_TOOLS_VERSION}"
    - |
      for platform in $(echo "${BUILD_PLATFORMS}" | tr ',' ' '); do
        docker buildx build . --load --pull --no-cache --platform "${platform}" -t zitadel-tools:test \
          --build-arg ZITADEL_TOOLS_VERSION="${ZITADEL_TOOLS_VERSION}" --build-arg BUILD_DATE="${BUILD_DATE}"
        sh test/smoke.sh zitadel-tools:test "${ZITADEL_TOOLS_VERSION}" "${platform}"
      done
    - |
      TAGS=""
      for tag in latest ${ZITADEL_TOOLS_VERSION%%.*} ${ZITADEL_TOOLS_VERSION}; do
        TAGS="${TAGS} -t ${CI_REGISTRY_IMAGE}:${tag} -t ${DOCKER_REGISTRY}:${tag}"
      done
    - docker buildx build . --push --pull --platform ${BUILD_PLATFORMS} ${TAGS}
        --build-arg ZITADEL_TOOLS_VERSION=${ZITADEL_TOOLS_VERSION} --build-arg BUILD_DATE=${BUILD_DATE}

uploadReadme:
  stage: release
  retry: 2
  rules: *rulesPublish
  script:
    #### Docker Hub takes at most 25,000 characters - counted in bytes here, which is stricter
    - |
      size=$(wc -c < README.md)
      if [ "$size" -gt 25000 ]; then
        echo "README.md has $size bytes, Docker Hub takes 25000"
        exit 1
      fi
    #### '-e NAME' without a value reads it from the environment, so the token stays out of the process list
    - DOCKERHUB_PASSWORD="$DOCKER_HUB_TOKEN" docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="ZITADEL Tools (key2jwt, basicauth, migrate) with OpenSSL on Alpine - multi-platform, rebuilt weekly"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
